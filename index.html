<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pesanan Percetakan</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1d2330;--mu:#667085;--bd:#dfe3ea;--ac:#1f6feb;--ac2:#fff;--ok:#12805c;--wa:#b54708;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--card:#1d222b;--tx:#e8ebf0;--mu:#9aa4b2;--bd:#323a47;--ac:#5b9bff;--ac2:#0b1220;--ok:#4cc9a0;--wa:#f5a14b}}
:root[data-theme="dark"]{--bg:#14171d;--card:#1d222b;--tx:#e8ebf0;--mu:#9aa4b2;--bd:#323a47;--ac:#5b9bff;--ac2:#0b1220;--ok:#4cc9a0;--wa:#f5a14b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
nav{display:flex;gap:6px;margin-bottom:14px}
nav button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g .full{grid-column:1/-1}
@media (max-width:560px){.g{grid-template-columns:1fr}}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.btn{padding:10px 16px;border:0;border-radius:8px;background:var(--ac);color:var(--ac2);font:inherit;font-weight:600;cursor:pointer}
.btn.s{background:transparent;color:var(--ac);border:1px solid var(--bd);padding:6px 10px;font-weight:500;font-size:13px}
.tot{font-size:18px;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.it{padding:12px 0;border-bottom:1px solid var(--bd)}.it:last-child{border:0}
.mu{color:var(--mu);font-size:13px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd)}
.hide{display:none}
#invBox{overflow-x:auto}
#inv{background:#fff;color:#111;border:1px solid #ccc;border-radius:8px;padding:24px;width:794px;min-height:559px;font-size:13px;margin:0 auto}
#inv table{width:100%;border-collapse:collapse;margin:10px 0}
#inv th,#inv td{padding:8px;border-bottom:1px solid #ddd;text-align:left}
#inv .r{text-align:right}
@page{size:A5 landscape;margin:0}
@media print{
 body{background:#fff}.wrap>*:not(#v-inv){display:none!important}
 #v-inv .noprint{display:none!important}#inv{border:0;border-radius:0;padding:8mm;width:210mm;min-height:148mm;margin:0}#invBox{overflow:visible}.wrap{padding:0}
}
</style>
</head>
<body>
<div class="wrap">
<h1>🖨️ Pesanan Percetakan</h1>
<nav>
 <button id="t-form" class="on" onclick="show('form')">Pesanan Baru</button>
 <button id="t-list" onclick="show('list')">Daftar Pesanan</button>
 <button id="t-inv" onclick="show('inv')">Invoice</button>
</nav>

<section id="v-form" class="card">
 <form-like>
 <div id="editInfo" class="hide" style="margin-bottom:10px;font-weight:600;color:var(--wa)"></div>
 <div class="g">
  <div><label>Nama pemesan</label><input id="nama" placeholder="Nama lengkap"></div>
  <div><label>No. HP / WhatsApp</label><input id="hp" inputmode="tel" placeholder="08xxxxxxxxxx"></div>
  <div class="full"><label>Alamat (opsional)</label><input id="alamat"></div>
  <div><label>Jenis cetakan</label><select id="jenis" onchange="setHarga()"></select></div>
  <div id="manualWrap" class="hide"><label>Nama produk (tulis manual)</label><input id="manual" placeholder="mis. Kalender dinding, Nota 3 ply"></div>
  <div><label>Ukuran / spesifikasi</label><input id="spek" placeholder="mis. 3x1 m, art paper 260gsm"></div>
  <div><label>Jumlah</label><input id="qty" type="number" min="1" value="1" oninput="hitung()"></div>
  <div><label>Harga satuan (Rp)</label><input id="harga" type="number" min="0" oninput="hitung()"></div>
  <div><label>Diskon (Rp)</label><input id="diskon" type="number" min="0" value="0" oninput="hitung()"></div>
  <div><label>Uang muka / DP (Rp)</label><input id="dp" type="number" min="0" value="0" oninput="hitung()"></div>
  <div><label>Target selesai</label><input id="tgl" type="date"></div>
  <div class="full"><label>Catatan</label><textarea id="cat" rows="2"></textarea></div>
 </div>
 <div class="row" style="margin-top:14px">
  <div>Total: <span class="tot" id="total">Rp 0</span></div>
  <div class="row"><button class="btn s" id="bBatal" onclick="endEdit()" style="display:none">Batal</button><button class="btn" id="bSimpan" onclick="simpan()">Simpan &amp; Buat Invoice</button></div>
 </div>
 </form-like>
</section>

<section id="v-list" class="card hide">
 <div class="row"><strong>Semua pesanan</strong><span class="mu" id="cnt"></span></div>
 <div id="list"></div>
</section>

<section id="v-inv" class="hide">
 <div class="row noprint" style="margin-bottom:10px">
  <span class="mu">Simpan sebagai PDF atau PNG, lalu kirim lewat WhatsApp.</span>
  <div class="row"><button class="btn" onclick="window.print()">🖨️ Cetak</button><button class="btn" id="bPdf" onclick="simpanFile('pdf')">📄 Simpan PDF</button><button class="btn" id="bPng" onclick="simpanFile('png')">🖼️ Simpan PNG</button></div>
 </div>
 <div class="card noprint">
  <div class="g">
   <div><label>Nama usaha</label><input id="uNama" oninput="simpanUsaha()"></div>
   <div><label>Telepon usaha</label><input id="uHp" oninput="simpanUsaha()"></div>
   <div class="full"><label>Alamat usaha</label><input id="uAlamat" oninput="simpanUsaha()"></div>
   <div class="full"><label>Info pembayaran (rekening, dll.)</label><input id="uBayar" oninput="simpanUsaha()"></div>
  </div>
 </div>
 <div id="invBox"><div id="inv"><p>Belum ada invoice dipilih.</p></div></div>
</section>
</div>

var shown=null;
async function simpanFile(t){
 if(!shown){alert("Pilih atau buat pesanan terlebih dahulu");return}
 var dl=null;try{dl=window.claude?await claude.use("downloads"):null}catch(e){}
 if(!dl){alert("Fitur simpan file tidak tersedia di tampilan ini. Gunakan tombol Cetak lalu pilih Simpan sebagai PDF.");return}
 if(!window.html2canvas||(t==="pdf"&&!window.jspdf)){alert("Pustaka belum termuat, coba lagi sebentar lagi");return}
 var b=t==="pdf"?$("bPdf"):$("bPng"),old=b.textContent;b.textContent="Memproses…";b.disabled=true;
 try{
  var c=await html2canvas($("inv"),{scale:2,backgroundColor:"#ffffff"});
  if(t==="png"){
   var bl=await new Promise(function(r){c.toBlob(r,"image/png")});
   await dl.save({filename:shown.no+".png",data:bl});
  }else{
   var pdf=new window.jspdf.jsPDF({unit:"mm",format:"a5",orientation:"landscape"}),w=210,h=c.height*w/c.width;
   if(h>148){h=148;w=c.width*h/c.height}
   pdf.addImage(c.toDataURL("image/jpeg",0.95),"JPEG",0,0,w,h);
   await dl.save({filename:shown.no+".pdf",data:pdf.output("blob")});
  }
 }catch(e){if(!e||e.code!=="declined")alert("Gagal menyimpan file"+(e&&e.message?": "+e.message:""))}
 b.textContent=old;b.disabled=false;
}

 $("inv").innerHTML='<div class="row" style="align-items:flex-start"><div style="display:flex;align-items:center;gap:12px"><img src="'+LOGO+'" alt="" style="width:64px;height:64px;object-fit:contain"><div><h2 style="margin:0">'+esc(usaha.n)+'</h2><div>'+esc(usaha.a)+'<br>Telp: '+esc(usaha.h)+'</div></div></div><div style="text-align:right"><h2 style="margin:0">INVOICE</h2><div>'+esc(o.no)+'<br>Tanggal: '+esc(o.tgl)+'</div></div></div><hr>'+

 '<table><tr><th>Deskripsi</th><th class="r">Qty</th><th class="r">Harga</th><th class="r">Jumlah</th></tr><tr><td>'+esc(o.jenis)+(o.spek?'<br><small>'+esc(o.spek)+'</small>':'')+'</td><td class="r">'+o.qty+'</td><td class="r">'+rp(o.harga)+'</td><td class="r">'+rp(o.qty*o.harga)+'</td></tr></table>'+
 '<div class="row" style="align-items:flex-start"><div style="max-width:380px"><strong>Pembayaran:</strong><br>'+esc(usaha.b)+'<p style="margin-top:14px">Terima kasih atas pesanan Anda.</p></div><table style="width:300px;margin:0"><tr><td>Diskon</td><td class="r">- '+rp(o.diskon)+'</td></tr><tr><td><strong>Total</strong></td><td class="r"><strong>'+rp(tot)+'</strong></td></tr><tr><td>Uang muka (DP)</td><td class="r">'+rp(o.dp)+'</td></tr><tr><td><strong>Sisa bayar</strong></td><td class="r"><strong>'+rp(sisa)+'</strong></td></tr></table></div>'+
